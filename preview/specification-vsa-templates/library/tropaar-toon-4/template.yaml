# Hemelum — tropaar/kondak toon 4 (default voor `vsa mvsa` zonder --template).
# CLI-alias (playbook): hemelum-tropaar-toon-4 → id tropaar-toon-4.
# Canonieke id blijft tropaar-toon-4 (CI / library-pad).
# Gesynchroniseerd met MuseScore-export "Template - Tropaar (Toon 4).musicxml".
# do=F4 major. role: recite → breve (||O||) in MSCX, 2 tellen afspelen;
# haakjes = optional; staff text = ankers.
# laatste: twee cadenspaden (of:) — pad 0 = mi–re–mi (formuleblad);
# pad fa-close = mi–fa–mi (o.a. Hemelum-corpus). Mapper kiest via VSA-hoogte.

spec_version: draft-v0
id: tropaar-toon-4
genre: tropaar
also_used_as:
  - kondak
tone: 4
do: F4
mode: major
duration-model: default
pitches_status: provisional
source: "Hemelum tropaar/kondak toon 4; MuseScore Template - Tropaar (Toon 4).musicxml + corpus cadens fa"
cycle:
  - "1"
  - "2"
final: laatste

phrases:
  - id: "1"
    events:
      - role: open
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: cadence
        duration: "_"
        pitches: { S: mi, A: "#do", T: la-1, B: la-2 }

  - id: "2"
    events:
      - role: link
        duration: "~"
        optional: true
        pitches: { S: mi, A: "#do", T: la-1, B: re-1 }
      - role: cadence
        duration: "_"
        anchor: e.st.
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: cadence
        duration: "~"
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: recite
        duration: "__"
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: cadence
        duration: "~"
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: fa, A: re, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "_"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }

  - id: laatste
    events:
      - role: open
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - of:
          - id: re-close
            events:
              - role: cadence
                duration: "_"
                pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
              - role: cadence
                duration: "__"
                pitches: { S: mi, A: do, T: sol-1, B: do-1 }
          - id: fa-close
            events:
              - role: cadence
                duration: "_"
                pitches: { S: fa, A: re, T: la-1, B: re-1 }
              - role: cadence
                duration: "__"
                pitches: { S: mi, A: do, T: sol-1, B: do-1 }
