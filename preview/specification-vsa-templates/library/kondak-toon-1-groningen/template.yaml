# Groningen toon 1 (kondak + tropaar zondag) — do=F4 major.
# Bron: koormap Groningen; speelplan |: 1, 2 :| laatste.
# Frase 1: open do–re–mi (variabel), recite do, cadens naar fa (@l.st.).
# Frase 2: @e.st. op mi (scoped inzet), recite mi, cadens naar do (@l.st.).
# Frase 1a: recite mi, cadens re–mi–fa (@l.st.) — tropaar-slotregels vóór laatste.
# laatste: recite mi, cadens via fa terug naar mi (@l.st.).

spec_version: draft-v0
id: kondak-toon-1-groningen
genre: kondak
also_used_as:
  - tropaar
tone: 1
do: F4
mode: major
duration-model: default
pitches_status: provisional
source: "Koormap Groningen — kondak/tropaar zondag toon 1"
cycle:
  - "1"
  - "2"
final: laatste

mapping_plans:
  - id: tropaar-extended-close
    label: "|: 1, 2 :| 1, 1a, 1a, 2"
    when:
      stanza_count: 10
    steps:
      - repeat: ["1", "2"]
        until:
          remaining: 4
      - sequence: ["1", "1a", "1a", "2"]
        # Tropaar-slot: fa-cadensen (1a) en slotfrase als 2 (dalend naar do),
        # niet kondak-`laatste` (via fa terug naar mi).
  - id: standard
    label: "|: 1, 2 :| laatste"
    when:
      default: true
    steps:
      - repeat: ["1", "2"]
        until: final
      - phrase: laatste

phrases:
  - id: "1"
    events:
      - role: open
        duration: "~"
        optional: true
        pitches: { S: do, A: sol-1, T: mi-1, B: do-1 }
      - role: open
        duration: "~"
        optional: true
        pitches: { S: do, A: sol-1, T: mi-1, B: do-1 }
      - role: open
        duration: "~"
        optional: true
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: open
        duration: "~"
        optional: true
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: do, A: sol-1, T: mi-1, B: do-1 }
      - role: cadence
        duration: "~"
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: fa, A: do, T: la-1, B: fa-2 }
        # Extra fa-syllaben (lijk/heid, tus, …) via H6 op dit slot;
        # scoped nadruk wint show_anchor (vaak heid/God/…).

  - id: "2"
    events:
      - role: cadence
        duration: "_"
        optional: true
        anchor: e.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: re, A: ti-1, T: fa-1, B: sol-2 }
        # Holds op re (ge, ien, …) via H6.
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: do, A: sol-1, T: mi-1, B: do-1 }

  - id: "1a"
    events:
      - role: cadence
        duration: "_"
        optional: true
        anchor: e.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: re, A: ti-1, T: fa-1, B: sol-2 }
      - role: cadence
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: fa, A: do, T: la-1, B: fa-2 }

  - id: laatste
    events:
      - role: cadence
        duration: "_"
        optional: true
        anchor: e.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: fa, A: ti-1, T: sol-1, B: sol-2 }
        # Holds op fa via H6.
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
