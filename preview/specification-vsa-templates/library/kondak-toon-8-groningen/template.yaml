# Groningen toon 8 (kondak + tropaar zondag) — do=F4 major.
# Bron: _werk/kondak-zondag-toon-8-groningen.mvsa (@oct S=0 A=-1 T=-1 B=-1).
# Eén formulezin: open do–re–mi–fa, recite mi, cadens re → do (@l.st.).
# Speelplan: |: 1 :| laatste (laatste = zelfde slots).

spec_version: draft-v0
id: kondak-toon-8-groningen
genre: kondak
also_used_as:
