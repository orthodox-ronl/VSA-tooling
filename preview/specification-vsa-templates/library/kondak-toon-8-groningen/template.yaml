voice_oct:
  S: 0
  A: -1
  T: -1
  B: -1
cycle:
  - "1"
final: laatste

mapping_plans:
  - id: standard
    label: "|: 1 :| laatste"
    when:
      default: true
    steps:
      - repeat: ["1"]
        until: final
      - phrase: laatste

