# Groningen toon 5 (kondak + tropaar zondag) — do=F4 major.
# Canonieke S/A/T/B: _klaar_voor_acceptatie/kondak-zondag-toon-5-groningen.mvsa.
# Speelplan |: 1, 2, 3 :| laatste. @oct A=-1 (klaar-kondak).
# Frase 1: recite re → do → re → mi_ → do (@l.st.).
# Frase 2: e.st. mi → recite → melisma mi–re–do → re (@l.st.).
# Frase 3: recite re → ti-1 → (opt. melisma do–ti-1) → la-1 (@l.st.).
# Laatste: e.st. mi → los re–do → ons ti-1–do → ti-1 → la-1; A met #sol-1.

spec_version: draft-v0
id: kondak-toon-5-groningen
genre: kondak
also_used_as:
  - tropaar
tone: 5
do: F4
mode: major
duration-model: default
pitches_status: provisional
source: "Koormap Groningen — kondak/tropaar zondag toon 5"
voice_oct:
  S: 0
  A: -1
  T: -1
  B: -1
cycle:
  - "1"
  - "2"
  - "3"
final: laatste

mapping_plans:
  - id: standard
    label: "|: 1, 2, 3 :| laatste"
    when:
      default: true
    steps:
      - repeat: ["1", "2", "3"]
        until: final
      - phrase: laatste

phrases:
  - id: "1"
    events:
      - role: open
        duration: "~"
        optional: true
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: open
        duration: "~"
        optional: true
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: open
        duration: "_"
        optional: true
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: recite
        duration: "__"
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      # Kondak: zijt–Gij; tropaar korte openingszin springt naar mi_ (optional).
      - role: cadence
        duration: "~"
        optional: true
        pitches: { S: do, A: la-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "~"
        optional: true
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "_"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      # der/ge/daald_ (of korter) op dezelfde do → H6-holds tot @l.st.
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: do, A: do, T: mi-1, B: do-1 }

  - id: "2"
    events:
      - role: cadence
        duration: "_"
        optional: true
        anchor: e.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "~"
        optional: true
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        optional: true
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      # los_ melisma (mi–re–do); eerste mi mag same-pitch aan recite plakken
      - role: cadence
        duration: "_"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "~"
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "~"
        pitches: { S: do, A: la-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }

  - id: "3"
    events:
      - role: open
        duration: "~"
        optional: true
        pitches: { S: re, A: ti-1, T: fa-1, B: sol-2 }
      - role: open
        duration: "~"
        optional: true
        pitches: { S: re, A: ti-1, T: fa-1, B: sol-2 }
      - role: open
        duration: "_"
        optional: true
        pitches: { S: re, A: ti-1, T: fa-1, B: sol-2 }
      - role: recite
        duration: "__"
        pitches: { S: re, A: ti-1, T: fa-1, B: sol-2 }
      - role: cadence
        duration: "~"
        pitches: { S: ti-1, A: sol-1, T: fa-1, B: sol-2 }
      # Melisma brij_&~ (do–ti-1) óf losse lettergrepen lie_–ven
      - role: cadence
        duration: "_"
        pitches: { S: do, A: la-1, T: mi-1, B: la-2 }
      - role: cadence
        duration: "~"
        optional: true
        pitches: { S: ti-1, A: la-1, T: re-1, B: la-2 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: la-1, A: la-1, T: do-1, B: la-2 }

  - id: laatste
    # Recite op mi zodat (kom en ver) één S-slot wordt (klaar); daarna alleen cadens.
    events:
      - role: cadence
        duration: "_"
        optional: true
        anchor: e.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "_"
        pitches: { S: do, A: la-1, T: mi-1, B: la-2 }
      - role: cadence
        duration: "_"
        pitches: { S: ti-1, A: "#sol-1", T: mi-1, B: mi-2 }
      - role: cadence
        duration: "~"
        pitches: { S: do, A: la-1, T: mi-1, B: mi-2 }
      - role: cadence
        duration: "~"
        pitches: { S: ti-1, A: "#sol-1", T: re-1, B: mi-2 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: la-1, A: la-1, T: do-1, B: la-2 }
