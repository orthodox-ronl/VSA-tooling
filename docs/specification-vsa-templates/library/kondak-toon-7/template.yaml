# Groningen toon 7 (kondak + tropaar zondag) — do=F4 major.
# Bron: _klaar_voor_acceptatie/kondak-zondag-toon-7-groningen.mvsa
#   (niet wijzigen; alleen als referentie voor deze formule).
# Speelplan |: 1, 2 :| laatste.
# Frase 1: open re–mi–re, recite do, cadens (opt. do-melisma) → mi (@l.st.).
# Frase 2: recite mi, cadens mi → (opt. mi) → re (@l.st.).
# laatste: recite mi → re–do–ti–do–(do)–ti (@l.st.); T op do-slot: #fa-1.
# @oct A=-1 zoals in de geaccepteerde MVSA.

spec_version: draft-v0
id: kondak-toon-7
genre: kondak
also_used_as:
  - tropaar
tone: 7
do: F4
mode: major
duration-model: default
pitches_status: provisional
source: "Koormap Groningen — kondak/tropaar zondag toon 7 (MVSA-acceptatie)"
voice_oct:
  S: 0
  A: -1
  T: -1
  B: -1
cycle:
  - "1"
  - "2"
final: laatste

mapping_plans:
  - id: standard
    label: "|: 1, 2 :| laatste"
    when:
      default: true
    steps:
      - repeat: ["1", "2"]
        until: final
      - phrase: laatste

phrases:
  - id: "1"
    events:
      - role: open
        duration: "~"
        optional: true
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: open
        duration: "~"
        optional: true
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: open
        duration: "~"
        optional: true
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: recite
        duration: "__"
        pitches: { S: do, A: la-1, T: mi-1, B: la-2 }
      - role: cadence
        duration: "~"
        optional: true
        pitches: { S: do, A: la-1, T: mi-1, B: la-2 }
        # Kondak: {-&/hou} melisma do→re; tropaar slaat dit over ({/de}=re).
      - role: cadence
        duration: "~"
        optional: true
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
        # Tropaar: {/de}; kondak: zit in hou-melisma → overslaan.
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }

  - id: "2"
    events:
      - role: cadence
        duration: "_"
        optional: true
        anchor: e.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "~"
        optional: true
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
        # o.a. «ge» tussen af_ en daald_; ontbreekt bij bon_/den_.
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }

  - id: laatste
    events:
      - role: cadence
        duration: "_"
        optional: true
        anchor: e.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "~"
        pitches: { S: do, A: la-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "~"
        pitches: { S: ti-1, A: sol-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "_"
        pitches: { S: do, A: la-1, T: "#fa-1", B: re-2 }
      - role: cadence
        duration: "~"
        optional: true
        pitches: { S: do, A: la-1, T: "#fa-1", B: re-2 }
      - role: cadence
        duration: "~"
        optional: true
        pitches: { S: do, A: la-1, T: "#fa-1", B: re-2 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: ti-1, A: sol-1, T: re-1, B: sol-2 }
