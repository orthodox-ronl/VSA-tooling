# Groningen — tropaar/kondak toon 4.
# CLI/playbook-id: tropaar-toon-4-groningen (map = canonieke id).
# Referentie-instance (catalogus): kondak/zondag-toon-4/groningen
# do=F4 major. also_used_as kondak (zelfde formule).
#
# T.o.v. Hemelum (library/tropaar-toon-4-hemelum): zelfde laddergraden-eindes
# (B frase-1 close la-2=D3, frase-2 @l.st. sol-2=C3). Frase 1 B-pad:
# Groningen / → re-1 (hold) → la-2; Hemelum /2 → mi-1 → re-1 → la-2.
# Dat onderscheid blijft (kooroefening). Hemelum heeft ook of:/fa-close
# op `laatste`; Groningen hier alleen re-close.
# Hemelum blijft apart: tropaar-toon-4-hemelum (alias hemelum-tropaar-toon-4).

spec_version: draft-v0
id: tropaar-toon-4-groningen
genre: tropaar
also_used_as:
  - kondak
tone: 4
do: F4
mode: major
duration-model: default
pitches_status: provisional
source: >-
  Koormap Groningen — tropaar/kondak toon 4; referentie o.a.
  bibliotheek catalogus kondak/zondag-toon-4/groningen
cycle:
  - "1"
  - "2"
final: laatste

phrases:
  - id: "1"
    events:
      - role: open
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: cadence
        duration: "~"
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: cadence
        duration: "_"
        pitches: { S: mi, A: "#do", T: la-1, B: la-2 }

  - id: "2"
    events:
      - role: link
        duration: "~"
        optional: true
        pitches: { S: mi, A: "#do", T: la-1, B: re-1 }
      - role: cadence
        duration: "_"
        anchor: e.st.
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: cadence
        duration: "~"
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: recite
        duration: "__"
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: cadence
        duration: "~"
        pitches: { S: fa, A: re, T: la-1, B: re-1 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: fa, A: re, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "_"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }

  - id: laatste
    events:
      - role: open
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: recite
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "__"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
