# Stichier toon 1 (Groningen) — do=F4 major.
# Corpus: heer-ik-roep toon 1 (twee coupletten, MSCZ-schets).
# Speelplan: 1, |: 2, 3 :| … — 4e cyclusfrase = 2 (niet 1); bij n×3 (≥6):
#   … 2, voorlaatste, laatste.
# Pitches provisional (weinig bronmateriaal; slots bewust ruim). Contract T1–T7.

spec_version: draft-v0
id: stichier-toon-1-groningen
genre: stichier
tone: 1
do: F4
mode: major
duration-model: default
pitches_status: provisional
source: >-
  Koormap Groningen — stichiermelodie toon 1
  (Heer ik roep / Laat mijn gebed; MSCZ-schets)
voice_oct:
  S: 0
  A: 0
  T: -1
  B: -2
cycle:
  - "1"
  - "2"
  - "3"
final: laatste

mapping_plans:
  # Verzamel-VSA met twee coupletten (6+5) achter elkaar.
  - id: two-couplets
    label: "couplet1 + couplet2 (11 strofes)"
    when:
      stanza_count: 11
    steps:
      - phrase: "1"
      - phrase: "2"
      - phrase: "3"
      - phrase: "2"
      - phrase: voorlaatste
      - phrase: laatste
      - phrase: "1"
      - phrase: "2"
      - phrase: "3"
      - phrase: "2"
      - phrase: laatste
  - id: triple-close
    label: "1, |: 2, 3 :| 2, voorlaatste, laatste"
    when:
      stanza_count_mod:
        mod: 3
        remainder: 0
      stanza_count_min: 6
    steps:
      - phrase: "1"
      - repeat: ["2", "3"]
        until:
          remaining: 3
      - phrase: "2"
      - phrase: voorlaatste
      - phrase: laatste
  - id: standard
    label: "1, |: 2, 3 :| …, laatste"
    when:
      default: true
    steps:
      - phrase: "1"
      - repeat: ["2", "3"]
        until:
          remaining: 1
      - phrase: laatste

phrases:
  # Cycle-frasen: voorlopig alleen recite + slotcadens (provisional;
  # mid-contour later aanscherpen met meer bronmateriaal).
  - id: "1"
    events:
      - role: recite
        duration: "~"
        pitches: { S: fa, A: re, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: do, A: la-1, T: mi-1, B: la-2 }

  - id: "2"
    events:
      - role: recite
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }

  - id: "3"
    events:
      - role: recite
        duration: "~"
        pitches: { S: fa, A: re, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }

  - id: voorlaatste
    events:
      - role: recite
        duration: "~"
        pitches: { S: fa, A: re, T: sol-1, B: sol-2 }
      - role: cadence
        duration: "_"
        anchor: l.st.
        pitches: { S: do, A: la-1, T: mi-1, B: la-2 }

  # laatste — bronnotatie (absolute letters, do=F4):
  #   S: c/recite d/4 [l.st] c/2 bb/2 [l.lgr.] melisma a bb a g
  #   A: a/recite bb/4 [l.st] a/2 g/2  [l.lgr.] melisma f g f e
  #   T: f+/recite f+/4 [l.st] f+/2 e/2 [l.lgr.] melisma c c c
  #   B: f/recite f/4 [l.st] f/2 c/2   [l.lgr.] melisma f e f c-
  # f+ ≈ F in T-oktaaf (graad do); c- ≈ C onder B (sol-2). Durations /4→_ /2→~ /1→~.
  - id: laatste
    events:
      - role: recite
        duration: "~"
        pitches: { S: sol, A: mi, T: do, B: do-1 }
      - role: cadence
        duration: "_"
        pitches: { S: la, A: fa, T: do, B: do-1 }
      - role: cadence
        duration: "~"
        anchor: l.st.
        pitches: { S: sol, A: mi, T: do, B: do-1 }
      - role: cadence
        duration: "~"
        pitches: { S: fa, A: re, T: ti-1, B: sol-2 }
      # Slotmelisma op de laatste lettergreep (mapping-vsa H8 / l.lgr.)
      - role: cadence
        duration: "~"
        anchor: l.lgr.
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "~"
        pitches: { S: fa, A: re, T: sol-1, B: ti-2 }
      - role: cadence
        duration: "~"
        pitches: { S: mi, A: do, T: sol-1, B: do-1 }
      - role: cadence
        duration: "~"
        pitches: { S: re, A: ti-1, T: sol-1, B: sol-2 }
