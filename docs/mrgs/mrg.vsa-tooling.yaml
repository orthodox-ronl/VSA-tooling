    vsntag: "vsa-tooling"
  - git_date: 2026-08-14T00:00:00.000Z
    slug: "formulelabel"
    term: "formulelabel"
    termType: "concept"
    glossaryTerm: "Formulelabel"
    glossaryText: "een [frase-id](@) (bijv. `1`, `2`, `laatste`) of [frase-anker](@) (bijv. `e. st.`, `l. st.`) die wordt gebruikt door onze tooling; ze staan boven de notenbalk van een formulepartituur."
    formPhrases:
      - "formulelabel"
      - "formulelabels"
      - "formule-label"
      - "formule-labels"
    glossaryNotes:
      - "Alle formulelabels staan op dezelfde hoogte, boven de noten, zonder autoplace."
      - "Een [frase-anker](@) heeft daaronder nog een pijl die strak naar de betreffende noot wijst; die pijl is geen tweede label."
      - "Schrijf in docs ‘formulelabel’ (TermRef) als je het bladmerk als geheel bedoelt; gebruik [frase-id](@) of [frase-anker](@) als je het type bedoelt."
    scopetag: "vsa-tooling"
    locator: "formulelabel.md"
    navurl: "https://orthodox-ronl.github.io/VSA-tooling/terminologie/formulelabel"
    headingids:
      - "formulelabel"
      - "status"
      - "motivatie"
      - "gerelateerd-/-verder-lezen"
    termid: "concept:formulelabel"
    vsntag: "vsa-tooling"
  - git_date: 2026-08-14T00:00:00.000Z
    slug: "frase-anker"
    term: "frase-anker"
    termType: "concept"
    glossaryTerm: "Frase-anker"
    glossaryText: "een label op een [template-event](@) (`e.st.`, `l.st.`, `vl.st.`, `l.lgr.`) dat op het toonboekblad aangeeft welke tekstklemtoon (eerste / laatste / voorlaatste streek, of start van het slotmelisma op de laatste lettergreep) op die noot hoort te vallen."
    formPhrases:
      - "frase-anker"
      - "frase-ankers"
    glossaryNotes:
      - "Op het blad: afkorting `e. st.`, `l. st.`, `vl. st.`, `l. lgr.` als [formulelabel](@), met een pijl **onder** de afkorting die naar de noot wijst."
      - "`l.lgr.` wijst naar het begin van een slotmelisma: die noot en alle noten erna in de frase horen bij de laatste lettergreep."
      - "De YAML-waarde is zonder spaties (`l.st.`); op het blad mét spaties (`l. st.`)."
      - "Schrijf in docs ‘frase-anker’ (TermRef), niet los ‘anker’."
    scopetag: "vsa-tooling"
    locator: "frase-anker.md"
    navurl: "https://orthodox-ronl.github.io/VSA-tooling/terminologie/frase-anker"
    headingids:
      - "frase-anker"
      - "motivatie"
      - "gerelateerd-/-verder-lezen"
    termid: "concept:frase-anker"
    vsntag: "vsa-tooling"
  - git_date: 2026-08-14T00:00:00.000Z
    slug: "frase-id"
    term: "frase-id"
    termType: "concept"
    glossaryTerm: "Frase-id"
    glossaryText: "de machineleesbare id van een [template-frase](@) in een [vsa-template](@) (`1`, `2`, `laatste`, …); op het toonboekblad het cijfer of woord in een cirkel of vierkant boven de eerste noot van die frase."
    formPhrases:
      - "frase-id"
      - "frase-ids"
    glossaryNotes:
      - "De id is `1`, `2`, `laatste`, enzovoort — ongeacht of het blad een cirkel of een vierkant toont."
      - "Op het blad is de frase-id een [formulelabel](@); in YAML is het de sleutel van `phrases:`."
      - "Schrijf in docs ‘frase-id’ (TermRef), niet los ‘id’ of ‘frase-nummer’."
    scopetag: "vsa-tooling"
    locator: "frase-id.md"
