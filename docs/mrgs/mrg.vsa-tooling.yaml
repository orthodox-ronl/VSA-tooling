    isa: "lengte-modifier"
    glossaryTerm: "Enkelvoudige lengte-modifier"
    glossaryAbbr: "ELM"
    glossaryText: "een [lengte-modifier](@) die uit precies één geldige ELM bestaat en daarmee precies een duurpositie representeert."
