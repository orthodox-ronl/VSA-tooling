  - git_date: 2026-08-08T00:00:00.000Z
    term: "afgeleide"
    formPhrases:
      - "afgeleide"
      - "afgeleiden"
      - "afgeleide-n"
    glossaryTerm: "Afgeleide"
    glossaryText: "Een bestand dat volledig en herhaalbaar door een [conversiemechanisme](@) uit een [bronbestand](@) wordt gegenereerd, en dat (dus) niet als [bronbestand](@) in de [bron-repository](@) staat."
    glossaryNotes:
      - "Voorbeelden: `.svg` via `vsa svg`; `.mxl` via `vsa musicxml`."
      - "Afgeleiden worden niet getrackt in de [bron-repository](@); ze worden gegenereerd tijdens de build."
    scopetag: "bron"
    locator: "afgeleide.md"
    navurl: "https://orthodox-ronl.github.io/bron/terms/afgeleide"
    headingids:
      - "afgeleide"
      - "motivatie"
    termType: "concept"
    termid: "concept:afgeleide"
    vsntag: "bron"
  - git_date: 2026-08-08T00:00:00.000Z
    term: "alias"
    formPhrases:
      - "alias"
      - "aliassen"
    glossaryTerm: "Alias"
    glossaryText: "Een voor mensen leesbare naam of werknaam voor een entiteit ([zangstuk](@), [variant](@), [uitvoeringsvorm](@) of [representatie](@)), die op de invoergrens mag worden gebruikt en door een resolver wordt omgezet naar het [canonieke id](@) in opslag."
    glossaryNotes:
      - "Aliassen mogen spaties, hoofdletters, diacritica en andere talen bevatten; het [canonieke id](@) blijft `^[a-z0-9_-]+$`."
      - "Binnen één scope mag een alias niet op twee verschillende entiteiten wijzen; bij meerdere matches is er een ambiguïteitsfout."
      - "Niet verwarren met het [canonieke id](@) zelf, noch met [herkomst](@) (waar iets vandaan komt)."
    scopetag: "bron"
    locator: "alias.md"
    navurl: "https://orthodox-ronl.github.io/bron/terms/alias"
    headingids:
      - "alias"
      - "motivatie"
      - "gerelateerd"
    termType: "concept"
    termid: "concept:alias"
    vsntag: "bron"
  - git_date: 2026-08-09T00:00:00.000Z
    slug: "ast"
    term: "ast"
    termType: "concept"
    glossaryTerm: "Abstract Syntax Tree"
    glossaryAbbr: "AST"
    glossaryText: "een expliciete nodeboom die door de [parser](@) uit [VSA](@)-invoer wordt geproduceerd en die [validator](@) en [renderer](@) zonder semantische herinterpretatie kunnen lezen."
    glossaryAlias: "Syntactische boom"
    formPhrases:
      - "ast"
      - "asts"
      - "abstract-syntax-tree"
      - "abstract-syntax-trees"
      - "syntactische-boom"
      - "syntactische-bomen"
    scopetag: "vsa-tooling"
    locator: "ast.md"
    navurl: "https://orthodox-ronl.github.io/VSA-tooling/terminologie/ast"
    headingids:
      - "ast"
    termid: "concept:ast"
    vsntag: "vsa-tooling"
  - git_date: 2026-08-09T00:00:00.000Z
    slug: "bracket-directive"
    term: "bracket-directive"
    termType: "concept"
    glossaryTerm: "Bracket-directive"
    glossaryText: "een tekstfragment dat als afzonderlijk [VSA](@)-token tussen `[` en `]` voorkomt en door bracket-dispatch wordt geclassificeerd voordat de inhoudelijke parsing verdergaat."
    glossaryAlias: "Bracket-token"
    formPhrases:
      - "bracket-directive"
      - "bracket-directives"
      - "bracket-token"
      - "bracket-tokens"
    scopetag: "vsa-tooling"
    locator: "bracket-directive.md"
    navurl: "https://orthodox-ronl.github.io/VSA-tooling/terminologie/bracket-directive"
    headingids:
      - "bracket-directive"
    termid: "concept:bracket-directive"
    vsntag: "vsa-tooling"
  - git_date: 2026-08-19T00:00:00.000Z
    term: "bron-repository"
    formPhrases:
      - "bron-repository"
      - "bron-repository-s"
      - "bron-repositories"
      - "bron-repo"
      - "bron-repos"
      - "bron-repo-s"
    glossaryTerm: "Bron-repository"
    glossaryAlias: "Bron-repo"
    glossaryText: "De git-repository `orthodox-ronl/bron` (of een expliciet aangewezen opvolger); de centrale opslagplaats voor [representaties](@) van [uitvoeringsvormen](@) (van [varianten](@)) van [zangstukken](@), alsmede voor de specificaties van de opslag, en van manieren om daarin te zoeken."
    glossaryNotes:
      - "Niet verwarren met [bronbestand](@) (een bestand) of [herkomst](@) (metadata over oorsprong)."
      - "Repositories voor de [VSA-tooling](https://github.com/orthodox-ronl/VSA-tooling/), of parochie-specifieke zaken en vendor-checkouts zijn geen bron-repository."
    scopetag: "bron"
    locator: "bron-repository.md"
    navurl: "https://orthodox-ronl.github.io/bron/terms/bron-repository"
    headingids:
      - "bron-repository"
      - "motivatie"
    termType: "concept"
    termid: "concept:bron-repository"
    vsntag: "bron"
  - git_date: 2026-07-11T00:00:00.000Z
    term: "bronbestand"
    formPhrases:
      - "bronbestand"
      - "bronbestanden"
    glossaryTerm: "Bronbestand"
    glossaryText: "Een bestand waarvoor geen geautomatiseerd, herhaalbaar [conversiemechanisme](@) bestaat dat het volledig uit een ander getrackt bestand in dezelfde repository genereert."
    glossaryNotes:
      - "Voor het opnemen van bronbestanden in de [bron-repo](@) is dus altijd tenminste één handmatige actie vereist."
      - heading: "Voorbeelden van bronbestanden:"
        items:
          - "handmatig geschreven `.vsa` bestanden."
          - "gescande documenten (met extensies als `.tif`, `.jpg`, `.pdf` e.d.)"
          - "MusicXML of MXL bestanden die door een programma als MuseScore zijn gemaakt"
          - "Een `.coria.html` bestand zoals je die door `https://coria.nl/` kunt laten maken (en dan in de repo zetten)"
      - heading: "Voorbeelden van [afgeleiden](@) (dat zijn per definitie GEEN bronbestanden):"
        items:
          - "`.svg` bestanden die middels de [vsa tool](@) zijn gegenereerd."
          - "HTML bestanden zoals die zijn gegenereerd uit geautomatiseerde workflows."
    scopetag: "bron"
    locator: "bronbestand.md"
    navurl: "https://orthodox-ronl.github.io/bron/terms/bronbestand"
    headingids:
      - "bronbestand"
      - "motivatie"
    termType: "concept"
    termid: "concept:bronbestand"
    vsntag: "bron"
  - git_date: 2026-08-19T00:00:00.000Z
    term: "canoniek-id"
    formPhrases:
      - "canoniek-id"
      - "canonieke-id"
      - "canonieke-ids"
      - "canoniek-ids"
      - "canonieke-id-s"
    glossaryTerm: "Canonieke id"
    glossaryText: "De stabiele, machine-leesbare identifier van een entiteit ([zangstuk](@), [variant](@), [uitvoeringsvorm](@) of [representatie](@)) in opslag: lowercase ASCII volgens `^[a-z0-9_-]+$`, zonder spaties, diacritica of Cyrillisch."
    glossaryNotes:
      - "Voorbeelden: `zangstuk-id` `antifoon-1-weekdagen`, `uitvoeringsvorm-id` `groningen`."
      - "Op de invoergrens mag een [alias](@) gebruikt worden; de resolver levert altijd het [canonieke id](@) voor paden, yaml, git en `bron:…`-referenties."
      - "Niet verwarren met [alias](@) (menselijke werknaam) of met [herkomst](@) (waar iets vandaan komt)."
    scopetag: "bron"
    locator: "canoniek-id.md"
    navurl: "https://orthodox-ronl.github.io/bron/terms/canoniek-id"
    headingids:
      - "canonieke-id"
      - "motivatie"
      - "gerelateerd"
    termType: "concept"
    termid: "concept:canoniek-id"
    vsntag: "bron"
  - git_date: 2026-07-11T00:00:00.000Z
    term: "compositie"
    formPhrases:
      - "compositie"
      - "composities"
    glossaryTerm: "Compositie"
    glossaryText: "Een YAML-bestand onder `composities/` in de [bron-repository](@) met geordende verwijzingen naar [zangstukken](@) (toekomstig: via `zangstuk-id`, `variant-id`, `uitvoeringsvorm-id`). Nog niet geïmplementeerd."
    glossaryNotes:
      - "Nog niet geïmplementeerd in de [bron-repository](@)."
      - "Niet verwarren met [samenstelling](@) (parochie-markdown met `:::include`) of sjabloon (markdown met `:::include zoek=`)."
    scopetag: "bron"
    locator: "compositie.md"
    navurl: "https://orthodox-ronl.github.io/bron/terms/compositie"
    headingids:
      - "compositie"
      - "motivatie"
    termType: "concept"
    termid: "concept:compositie"
    vsntag: "bron"
  - git_date: 2026-08-09T00:00:00.000Z
    slug: "control-token"
    term: "control-token"
    termType: "concept"
    isa: "bracket-directive"
    glossaryTerm: "Control-token"
    glossaryAlias: "Renderer-directive"
    glossaryText: "een [bracket-directive](@) / [bracket-token](@) waarvan de tokenwaarde een ondersteunde control-tokenvorm is, zoals `[*]`, `[/]`, `[*?]` of `[/?]`, en die niet als [pitch-marker](@) / [hoogte-markering](@) wordt geparseerd."
    formPhrases:
      - "control-token"
      - "control-tokens"
      - "renderer-directive"
      - "renderer-directives"
    scopetag: "vsa-tooling"
    locator: "control-token.md"
    navurl: "https://orthodox-ronl.github.io/VSA-tooling/terminologie/control-token"
    headingids:
      - "control-token"
    termid: "concept:control-token"
    vsntag: "vsa-tooling"
  - git_date: 2026-07-11T00:00:00.000Z
    term: "conversiemechanisme"
    formPhrases:
      - "conversiemechanisme"
      - "conversiemechanismen"
    glossaryTerm: "Conversiemechanisme"
    glossaryText: "Een gedefinieerde, geautomatiseerde en herhaalbare tool CM die een [bronbestand](@) B omzet naar een [afgeleide](@) AB = CM(B)."
    glossaryNotes:
      - "Voorbeelden: `vsa svg` (VSA → SVG), `vsa musicxml` (VSA → MXL)."
      - "Het bestaan van een conversiemechanisme is het criterium waarmee onderscheid wordt gemaakt tussen [bronbestand](@) en [afgeleide](@)."
    scopetag: "bron"
    locator: "conversiemechanisme.md"
    navurl: "https://orthodox-ronl.github.io/bron/terms/conversiemechanisme"
    headingids:
      - "conversiemechanisme"
      - "motivatie"
    termType: "concept"
    termid: "concept:conversiemechanisme"
    vsntag: "bron"
  - git_date: 2026-08-09T00:00:00.000Z
    slug: "diagnostic"
    term: "diagnostic"
    termType: "concept"
    glossaryTerm: "Diagnostic"
    glossaryText: "een melding die door [parser](@) of [validator](@) wordt geproduceerd en ten minste een foutcode, [severity](@) / [ernstniveau](@), bronlocatie en uitleg of context bij een vastgestelde afwijking bevat."
    glossaryAlias: "Diagnostische melding"
    formPhrases:
      - "diagnostic"
      - "diagnostics"
      - "diagnostische-melding"
      - "diagnostische-meldingen"
    scopetag: "vsa-tooling"
    locator: "diagnostic.md"
    navurl: "https://orthodox-ronl.github.io/VSA-tooling/terminologie/diagnostic"
    headingids:
      - "diagnostic"
    termid: "concept:diagnostic"
    vsntag: "vsa-tooling"
  - git_date: 2026-08-09T00:00:00.000Z
    slug: "do-context"
    term: "do-context"
    termType: "concept"
    glossaryTerm: "Do-context"
    glossaryText: "de grondtooncontext waarbinnen relatieve toonhoogtebewegingen in [VSA-notatie](@bron) en in een [vsa-template](@) worden geïnterpreteerd; voor MusicXML-export of afspelen vastgelegd via blok-[metadata](@) (`do`, `mode`), niet via de zangtekst zelf."
    glossaryAlias: "Tooncontext"
    formPhrases:
      - "do-context"
      - "do-contexts"
      - "tooncontext"
      - "tooncontexten"
    glossaryNotes:
      - "Voorbeeld: `do=\"F4\"` en `mode=\"major\"` in een [VSA-blok](@), `.vsa`-frontmatter, of een [vsa-template](@)."
      - "Een begin-[pitch-marker](@) / [hoogte-markering](@) `[:]` betekent: start op de do-context."
    scopetag: "vsa-tooling"
    locator: "do-context.md"
    navurl: "https://orthodox-ronl.github.io/VSA-tooling/terminologie/do-context"
    headingids:
      - "do-context"
      - "motivatie"
      - "gerelateerd-/-verder-lezen"
    termid: "concept:do-context"
    vsntag: "vsa-tooling"
  - git_date: 2026-08-09T00:00:00.000Z
    slug: "enkelvoudige-hoogte-modifier"
    term: "enkelvoudige-hoogte-modifier"
    termType: "concept"
    isa: "hoogte-modifier"
