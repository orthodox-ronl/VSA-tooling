[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsa-tool"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0",
    # Let op: PyPI heeft een ánder package "catalogus" (Breezy).
    # Installeer altijd eerst orthodox-ronl/bron (scripts/bootstrap.cmd).
    "catalogus>=0.1.0",
    "markdown>=3.5",
    "pyphen>=0.14",
]

[project.scripts]
vsa = "vsa.cli:main"
mvsa = "vsa.cli_mvsa:main"
mxl = "vsa.cli_mxl:main"
mscz = "vsa.cli_mscz:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
rendering = [
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.0",
]
