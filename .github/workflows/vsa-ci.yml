# VSA CI — Windows-validatie bij elke push/PR.
# Doel: scripts\check.cmd (pytest, validate + build-markdown op examples/consumer-minimal).
# Lokaal: check

name: VSA CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: vsa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ci:
    name: Windows tool CI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout bibliotheek repository
        uses: actions/checkout@v5
        with:
          repository: orthodox-ronl/bibliotheek
          path: vendor/bibliotheek
          ref: development

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Run VSA CI
        shell: cmd
        env:
          # Expliciet pad (VSA_SYLLABLE_DICTIONARY); vsa.toml wint in de CLI, daarom
          # junction zodat ../bibliotheek/data/… op CI bestaat (zelfde als lokaal sibling).
          VSA_SYLLABLE_DICTIONARY: vendor/bibliotheek/data/syllable_dictionary.nl.txt
        run: |
          if not exist ..\bibliotheek (
            mklink /J ..\bibliotheek vendor\bibliotheek
          )
          scripts\ci.cmd
