site_name: VSA-tooling — documentatie
site_description: Documentatie van de VSA-toolchain (parser, validatie, SVG/MusicXML, hergebruik)
site_url: https://orthodox-ronl.github.io/VSA-tooling/
repo_url: https://github.com/orthodox-ronl/VSA-tooling
repo_name: orthodox-ronl/VSA-tooling
edit_uri: edit/main/docs/

exclude_docs: |
  overrides/**
  history/**
  architecture/**
  mrgs/**
  /README.md
  /status-en-roadmap.md
  /saf.yaml
  /tev2-config.yaml
  /to-do-van-mij.md
  plans/uitgaveprofielen.md

not_in_nav: |
  guides/assets/**
  guides/README.md
  guides/musicxml.md
  guides/testing.md
  guides/quick-start.md
  guides/hugo-workflow.md
  guides/hugo-site-structure.md
  plans/onderzoeks-prompt.md
  reference/cli.md
  terminologie/**
  specification-vsa-templates/examples/**
  specification-vsa-templates/library/**
  specification-vsa-templates/schema/**

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    unrecognized_links: info
    anchors: info

theme:
  name: material
  language: nl
  custom_dir: docs/overrides
  favicon: images/favicon.ico
  logo: images/favicon-32x32.png
  font:
    text: Source Sans 3
    code: Source Code Pro
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search
  - git-revision-date-localized:
      type: date
      locale: nl
      timezone: Europe/Amsterdam
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Starten:
    - Lokaal ontwikkelen: getting-started/README.md
  - Handleidingen:
    - Overzicht: manuals/index.md
    - Consumer-site — waar hoort wat: manuals/consumer-site.md
    - Gebruikershandleiding: guides/user-guide.md
    - CLI-taken: guides/cli-taken.md
    - Validatie: guides/validation.md
    - SVG exporteren: guides/svg-export.md
    - MusicXML-export: guides/musicxml-export.md
    - Rendering en fonts: guides/rendering-fonts.md
    - Parochie-lokaal VSA: guides/parochie-lokaal-vsa.md
    - Testen en regressie: guides/testing-and-regression.md
    - Liturgikon-notatie: guides/liturgikon-notatie.md
    - Navigatie-placeholders: guides/hugo-navigation-placeholders.md
  - Specificaties:
    - Overzicht: specification/README.md
    - Doel en scope: specification/overview.md
    - Syntax: specification/syntax.md
    - Semantiek: specification/semantics.md
    - Validatie: specification/validation.md
    - Directieven: specification/directives.md
    - Rendering: specification/rendering.md
    - CLI-contract: specification/cli.md
    - Conformiteit: specification/conformance.md
    - Foutafhandeling: specification/error-handling.md
    - Voorbeelden: specification/examples.md
    - Versionering: specification/versioning.md
    - Traceerbaarheid: specification/traceability.md
    - Open punten: specification/open-points.md
  - VSA-templates:
    - Overzicht: specification-vsa-templates/README.md
    - Doel en scope: specification-vsa-templates/overview.md
    - Requirements-inventory: specification-vsa-templates/requirements-inventory.md
    - Metamodel: specification-vsa-templates/metamodel.md
    - Syntax: specification-vsa-templates/syntax.md
    - Semantiek: specification-vsa-templates/semantics.md
    - Validatie: specification-vsa-templates/validation.md
    - Mapping VSA: specification-vsa-templates/mapping-vsa.md
    - Rendering-valkuilen: specification-vsa-templates/rendering-pitfalls.md
    - Voorbeelden: specification-vsa-templates/examples.md
    - Library: specification-vsa-templates/library/README.md
    - Conformiteit: specification-vsa-templates/conformance.md
    - Open punten: specification-vsa-templates/open-points.md
    - Versionering: specification-vsa-templates/versioning.md
  - Referentie:
    - Overzicht: reference/README.md
    - Voorbeelden:
      - Overzicht: reference/voorbeelden/index.md
      - reference/voorbeelden/basis.md
      - reference/voorbeelden/multiline.md
      - reference/voorbeelden/glyphs-overzicht.md
      - reference/voorbeelden/fouten.md
    - Fixtures-catalogus: reference/fixtures-catalogus.md
    - CLI:
      - Overzicht: reference/cli/index.md
      - reference/cli/validate.md
      - reference/cli/parse.md
      - reference/cli/blocks.md
      - reference/cli/svg.md
      - reference/cli/process.md
      - reference/cli/build-markdown.md
      - reference/cli/pdf.md
      - reference/cli/resolve-catalogus.md
      - reference/cli/musicxml.md
    - Grammatica: reference/grammar.md
    - Tokens: reference/tokens.md
    - Metadata: reference/metadata.md
    - Config: reference/config.md
    - Diagnostiek: reference/diagnostics.md
    - Outputs: reference/outputs.md
    - Include-vsa: reference/include-vsa.md
    - Traceerbaarheid: reference/traceability.md
  - Integratie:
    - Overzicht: integratie/index.md
    - Hergebruik vsa-tool: guides/reuse-vsa-tooling.md
    - TEv2 in tool-docs: guides/tev2-docs.md
  - Terminologie:
    - Overzicht: glossary.md
  - Plannen:
    - Overzicht: plans/README.md
    - plans/gebruikseisen-dragers.md
    - plans/docs-content-publiek-en-paginatypen.md
    - plans/vsa-polyphony-proposal.md

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  preview: false
  build_time: ""
  branch: ""
  social:
    - icon: fontawesome/solid/book-bible
      link: https://orthodox-ronl.github.io/bron/
      name: bron — documentatie
    - icon: fontawesome/solid/code
      link: https://orthodox-ronl.github.io/VSA-tooling/
      name: VSA-tooling — documentatie
    - icon: fontawesome/solid/globe
      link: https://orthodox-ronl.github.io/VSA-demo/
      name: VSA-demo
    - icon: fontawesome/solid/toolbox
      link: https://github.com/orthodox-ronl/VSA-tooling
      name: VSA-tooling — GitHub-repository
